<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Panel Studio · AI 圆桌演播厅</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">AI Panel Studio<span>圆桌演播厅</span></div>
  <nav class="nav">
    <a href="#/" data-nav="home">讨论列表</a>
    <a href="#/create" data-nav="create">发起讨论</a>
    <a href="#/archive" data-nav="archive">历史归档</a>
  </nav>
  <div class="mode" id="mode">—</div>
</header>

<main id="app"></main>

<template id="tpl-studio">
  <div class="studio">
    <section class="stage">
      <div class="stage-head">
        <div class="stage-title">
          <h1 class="topic"></h1>
          <div class="round-info">
            <span class="badge round">第 1 轮</span>
            <span class="focus"></span>
          </div>
        </div>
        <div class="stage-status"><span class="live-dot"></span><span id="live-status">连接中…</span></div>
      </div>
      <div class="stage-body" id="messages"></div>
      <div class="stage-foot"><span id="foot-info">主持人与嘉宾准备中…</span></div>
    </section>

    <aside class="side">
      <div class="panel">
        <div class="panel-head"><h3>专家状态</h3></div>
        <div class="panel-body" id="agents"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>共识与分歧</h3></div>
        <div class="panel-body" id="insights"></div>
      </div>
      <div class="panel panel-grow">
        <div class="panel-head">
          <h3>现场 Transcript</h3>
          <button class="ghost-btn" id="btn-tr-clear">清空视图</button>
        </div>
        <div class="panel-body" id="transcript"></div>
      </div>
    </aside>
  </div>
</template>

<script src="js/app.js"></script>
</body>
</html>
